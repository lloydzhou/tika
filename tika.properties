# Tika Configuration for PDF Table Detection
# This file shows how to configure PDF table detection using properties format

# Enable table detection in PDF parser (default is true)
pdf.detectTables=true

# Other useful PDF parser options
pdf.extractInlineImages=false
pdf.extractUniqueInlineImagesOnly=true
pdf.sortByPosition=false
pdf.enableAutoSpace=true
pdf.suppressDuplicateOverlappingText=false
pdf.extractAnnotationText=true
pdf.extractAcroFormContent=true
pdf.extractBookmarksText=true
pdf.extractFontNames=false
pdf.extractMarkedContent=false
pdf.extractXMPMetadata=false

# OCR Strategy options (if OCR is available):
# NO_OCR - No OCR, only extract existing text
# OCR_ONLY - Only use OCR, ignore existing text
# OCR_AND_TEXT_EXTRACTION - Use both existing text and OCR
# AUTO - Automatically choose based on content
# pdf.ocrStrategy=NO_OCR

# Image handling
# pdf.extractInlineImages=false
# pdf.imageStrategy=SKIP_IMAGES

# For debugging table detection issues:
# Enable these to get more verbose output
# pdf.extractFontNames=true
# pdf.extractMarkedContent=true